  <text x="24" y="64" fill="#F8FAFC" font-family="Consolas, monospace" font-size="22">{</text><text x="48" y="100" fill="#A855F7" font-family="Consolas, monospace" font-size="22">"type": "form",</text><text x="48" y="136" fill="#38BDF8" font-family="Consolas, monospace" font-size="22">"fields": [</text><text x="72" y="172" fill="#94A3B8" font-family="Consolas, monospace" font-size="22">{ "kind": "text" },</text><text x="72" y="208" fill="#94A3B8" font-family="Consolas, monospace" font-size="22">{ "kind": "select" }</text><text x="48" y="244" fill="#38BDF8" font-family="Consolas, monospace" font-size="22">],</text><text x="48" y="280" fill="#A855F7" font-family="Consolas, monospace" font-size="22">"layout": "grid"</text><text x="24" y="316" fill="#F8FAFC" font-family="Consolas, monospace" font-size="22">}</text></g>
